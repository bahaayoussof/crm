<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Customer Support CRM" />
    <link rel="icon" type="image/png" href="/brand/crm-icon.png" />
    <link rel="apple-touch-icon" href="/brand/crm-icon.png" />
    <title>Customer Support CRM</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("crm-theme") || "system";
          var isDark = theme === "dark" || (theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (isDark) {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
